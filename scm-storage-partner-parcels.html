<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07080b;font-family:'DM Mono',monospace}

#card{width:100%;height:100vh;display:flex;flex-direction:column;background:#07080b;border:1px solid #1c1f2b}

#head{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:#0b0d13;border-bottom:1px solid #1c1f2b;flex-shrink:0;gap:12px;flex-wrap:wrap}
#title{font-family:'Syne',sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#e2e8f0;display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:#06b6d4;box-shadow:0 0 7px rgba(6,182,212,.7);animation:p 2.4s infinite;flex-shrink:0}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
#title span{color:#06b6d4}
#stats{display:flex;gap:20px}
.st .v{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#06b6d4;line-height:1;display:block}
.st .l{font-size:8px;color:#475569;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}

#filters{display:flex;align-items:center;gap:8px;padding:9px 20px;background:#07080b;border-bottom:1px solid #1c1f2b;flex-shrink:0;flex-wrap:wrap}
select{background:#0f1117;border:1px solid #1e2536;color:#94a3b8;font-family:'DM Mono',monospace;font-size:10px;padding:5px 9px;border-radius:4px;cursor:pointer;outline:none;appearance:none}
select:focus{border-color:#06b6d4}
.rst{background:transparent;border:1px solid #1e2536;color:#475569;font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:4px;cursor:pointer}
.rst:hover{border-color:#06b6d4;color:#06b6d4}

#map{flex:1;width:100%}

#foot{padding:8px 20px;background:#0b0d13;border-top:1px solid #1c1f2b;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#foot-l{font-size:9px;color:#1e2536;letter-spacing:.04em}
#foot-r{font-size:9px;color:#06b6d4;font-weight:600;letter-spacing:.08em}

.leaflet-popup-content-wrapper{background:rgba(9,10,14,.97)!important;border:1px solid #1e2536!important;border-radius:6px!important;box-shadow:0 12px 40px rgba(0,0,0,.9)!important}
.leaflet-popup-content{color:#e2e8f0!important;font-family:'DM Mono',monospace!important;font-size:11px!important;line-height:1.65!important;margin:10px 14px!important}
.leaflet-popup-tip{background:rgba(9,10,14,.97)!important}
.leaflet-popup-close-button{color:#475569!important}
.pa{color:#06b6d4;font-weight:600;margin-bottom:3px}
.pm{color:#475569;font-size:10px}

@media(max-width:600px){
  #filters{display:none}
  #stats{gap:14px}
  .st .v{font-size:14px}
}
</style>
</head>
<body>
<div id="card">
  <div id="head">
    <div id="title"><div class="dot"></div>SCM <span>Storage Partner</span> Parcels</div>
    <div id="stats">
      <div class="st"><span class="v" id="sv-l">—</span><div class="l">Locations</div></div>
      <div class="st"><span class="v" id="sv-s">—</span><div class="l">States</div></div>
      <div class="st"><span class="v" id="sv-m">—</span><div class="l">Markets</div></div>
    </div>
  </div>
  <div id="filters">
    <select id="f-s"><option value="">All States</option></select>
    <select id="f-m"><option value="">All Markets</option></select>
    <button class="rst" id="f-r">Reset</button>
  </div>
  <div id="map"></div>
  <div id="foot">
    <span id="foot-l">© SCM Advisors · All rights reserved</span>
    <span id="foot-r" id="foot-r">—</span>
  </div>
</div>

var map=L.map('map',{zoomControl:true,scrollWheelZoom:false}).setView([39.5,-98.35],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a> © <a href="https://carto.com">CartoDB</a>',
  maxZoom:19
}).addTo(map);

var cl=L.markerClusterGroup({
  chunkedLoading:true,maxClusterRadius:55,showCoverageOnHover:false,spiderfyOnMaxZoom:true,
  iconCreateFunction:function(c){
    var n=c.getChildCount(),sz=n>99?42:38;
    return L.divIcon({
      html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.4);display:flex;align-items:center;justify-content:center;font-family:Syne,sans-serif;font-weight:800;font-size:11px;color:#e2e8f0;box-shadow:0 0 10px rgba(6,182,212,.2)">'+n+'</div>',
      className:'',iconSize:[sz,sz]
    });
  }
});
map.addLayer(cl);

var icon=L.divIcon({
  className:'',
  html:'<div style="width:8px;height:8px;border-radius:50%;background:#06b6d4;border:1px solid rgba(6,182,212,.35);box-shadow:0 0 6px rgba(6,182,212,.5)"></div>',
  iconSize:[8,8],iconAnchor:[4,4]
});

var states=[...new Set(D.map(function(p){return p.s}))].sort();
var markets=[...new Set(D.map(function(p){return p.m}))].sort();
function pop(id,arr){var s=document.getElementById(id);arr.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)})}
pop('f-s',states);pop('f-m',markets);

function plot(data){
  cl.clearLayers();
  data.forEach(function(p){
    var m=L.marker([p.la,p.lo],{icon:icon});
    var addr=[p.a,p.c,p.s].filter(Boolean).join(', ');
    m.bindPopup('<div class="pa">'+addr+'</div><div class="pm">'+p.m+'</div>');
    cl.addLayer(m);
  });
  document.getElementById('sv-l').textContent=data.length;
  document.getElementById('sv-s').textContent=[...new Set(data.map(function(p){return p.s}))].length;
  document.getElementById('sv-m').textContent=[...new Set(data.map(function(p){return p.m}))].length;
  document.getElementById('foot-r').textContent=data.length+' locations';
  try{map.fitBounds(cl.getBounds(),{padding:[40,40]})}catch(e){}
}

function filt(){
  var s=document.getElementById('f-s').value,m=document.getElementById('f-m').value;
  plot(D.filter(function(p){return(!s||p.s===s)&&(!m||p.m===m)}));
}
document.getElementById('f-s').addEventListener('change',filt);
document.getElementById('f-m').addEventListener('change',filt);
document.getElementById('f-r').onclick=function(){document.getElementById('f-s').value='';document.getElementById('f-m').value='';filt()};

plot(D);
</script>
