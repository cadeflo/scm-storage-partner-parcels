*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07080b;font-family:'DM Mono',monospace}

#stats{display:flex;gap:20px}

#filters{display:flex;align-items:center;gap:8px;padding:9px 20px;background:#07080b;border-bottom:1px solid #1c1f2b;flex-shrink:0;flex-wrap:wrap}

select:focus{border-color:#06b6d4}
.rst{background:transparent;border:1px solid #1e2536;color:#475569;font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:4px;cursor:pointer}
.rst:hover{border-color:#06b6d4;color:#06b6d4}
#map{flex:1;width:100%}
#foot{padding:8px 20px;background:#0b0d13;border-top:1px solid #1c1f2b;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#foot-l{font-size:9px;color:#1e2536;letter-spacing:.04em}
#foot-r{font-size:9px;color:#06b6d4;font-weight:600;letter-spacing:.08em}
.leaflet-popup-content-wrapper{background:rgba(9,10,14,.97)!important;border:1px solid #1e2536!important;border-radius:6px!important;box-shadow:0 12px 40px rgba(0,0,0,.9)!important}
.leaflet-popup-content{color:#e2e8f0!important;font-family:'DM Mono',monospace!important;font-size:11px!important;line-height:1.65!important;margin:10px 14px!important}
.leaflet-popup-tip{background:rgba(9,10,14,.97)!important}
.leaflet-popup-close-button{color:#475569!important}
.pa{color:#06b6d4;font-weight:600;margin-bottom:3px}
.pm{color:#475569;font-size:10px}
@media(max-width:600px){#filters{display:none}#stats{gap:14px}.st .v{font-size:14px}}

function plot(data){
  cl.clearLayers();
  data.forEach(function(p){
    var m=L.marker([p.la,p.lo],{icon:icon});
    var addr=[p.a,p.c,p.s].filter(Boolean).join(', ');
    m.bindPopup('<div class="pa">'+addr+'</div><div class="pm">'+p.m+'</div>');
    cl.addLayer(m);
  });
  document.getElementById('sv-l').textContent=data.length.toLocaleString();
  document.getElementById('sv-s').textContent=[...new Set(data.map(function(p){return p.s}))].length;
  document.getElementById('sv-m').textContent=[...new Set(data.map(function(p){return p.m}))].length;
  document.getElementById('foot-r').textContent=data.length.toLocaleString()+' sites';
  try{map.fitBounds(cl.getBounds(),{padding:[40,40],maxZoom:8})}catch(e){}
}
